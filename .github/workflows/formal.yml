name: Formal model

on:
  push:
    paths:
      - 'formal/**'
      - '.github/workflows/formal.yml'
  pull_request:
    paths:
      - 'formal/**'
      - '.github/workflows/formal.yml'
  workflow_dispatch:

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Check TLA+ model
      working-directory: formal
      run: ./check.sh
