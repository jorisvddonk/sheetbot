<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4682b4">
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
      <link rel="stylesheet" href="style.css">
     <link rel="icon" href="logo.png" type="image/png">
     <link rel="manifest" href="manifest.json">
    <script src="element-table.js" type="module"></script>
    <script src="element-grid.js" type="module"></script>
    <script src="element-contextmenu.js" type="module"></script>
    <script src="header.js"></script>
 </head>

<body>
     <div id="header-placeholder"></div>
     <ul id="sheetlist"></ul>
    <div class="table-wrapper"><element-grid id="spreadsheet"></element-grid></div>

    <script type="module">
        const params = new URL(document.URL).searchParams;
        const headers = {};
        if (localStorage.hasOwnProperty("jwt_token")) {
            headers["Authorization"] = `Bearer ${localStorage["jwt_token"]}`;
        }

        // Load all widgets and sheet data in parallel, render only when both are ready
        const widgetsReady = fetch('/widgets.json')
            .then(r => r.json())
            .then(urls => Promise.all(urls.map(url => import(url))));

        if (params.has("sheet")) {
            const pageSize = parseInt(params.get("pageSize") || "50", 10);
            Promise.all([
                fetch(`/sheets/${params.get("sheet")}?page=1&pageSize=${pageSize}`, { headers }).then(r => r.json()),
                widgetsReady
            ]).then(([data]) => {
                document.getElementById('spreadsheet').setAttribute('data', JSON.stringify({data: data.rows, columns: data.columns, total: data.total, page: 1, pageSize}));
            });
        } else {
            fetch(`/sheets`, { headers }).then(r => r.json()).then(data => {
                data.forEach(sheetName => {
                    const elem = document.createElement("a");
                    elem.innerText = sheetName;
                    elem.setAttribute("href", `/sheet.html?sheet=${sheetName}`);
                    const li = document.createElement("li");
                    li.appendChild(elem);
                    document.getElementById('sheetlist').appendChild(li);
                });
            });
        }
    </script>
</body>

</html>
