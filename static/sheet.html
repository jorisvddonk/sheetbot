    <script src="header.js"></script>
 </head>

<body>
     <div id="header-placeholder"></div>
     <ul id="sheetlist"></ul>
    <div class="table-wrapper"><element-grid id="spreadsheet"></element-grid></div>

    <script>
        const params = new URL(document.URL).searchParams;
        const headers = {};
        if (localStorage.hasOwnProperty("jwt_token")) {
            headers["Authorization"] = `Bearer ${localStorage["jwt_token"]}`;
        }
        if (params.has("sheet")) {
            const pageSize = parseInt(params.get("pageSize") || "50", 10);
            const data = fetch(`/sheets/${params.get("sheet")}?page=1&pageSize=${pageSize}`, { headers: headers }).then(response => {
                return response.json()
            }).then(data => {
                document.getElementById('spreadsheet').setAttribute('data', JSON.stringify({data: data.rows, columns: data.columns, total: data.total, page: 1, pageSize}));
            });
        } else {
            const data = fetch(`/sheets`, { headers: headers }).then(response => {
                return response.json()
            }).then(data => {
                data.forEach(sheetName => {
                    const elem = document.createElement("a");
                    elem.innerText = sheetName;
                    elem.setAttribute("href", `/sheet.html?sheet=${sheetName}`);
                    const li = document.createElement("li");
                    li.appendChild(elem);
                    document.getElementById('sheetlist').appendChild(li);
                });
            });
        }

    </script>
</body>

</html>
